<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart with Discounts</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f4f8;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1, h2 {
    text-align: center;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.product {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.product button {
    margin-top: 10px;
    background: #4f46e5;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
}

/* CART */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #f7f7f7;
}

input[type="number"] {
    width: 70px;
    padding: 5px;
}

button.remove {
    background: #e63946;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}

/* TOTAL */
.summary {
    margin-top: 20px;
    text-align: right;
}

.summary p {
    font-size: 16px;
}

.total {
    font-size: 20px;
    font-weight: bold;
    color: #2ecc71;
}
</style>
</head>

<body>

<div class="container">
    <h1>🛍 Products</h1>

    <div class="products" id="productList"></div>

    <h2>🛒 Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody id="cartBody"></tbody>
    </table>

    <div class="summary">
        <p>Discount: ₹<span id="discount">0</span></p>
        <p class="total">Total: ₹<span id="total">0</span></p>
    </div>
</div>

<script>
/* ---------- DATA ---------- */
const storeProducts = [
    { id: 1, name: "Laptop", category: "Electronics", price: 60000 },
    { id: 2, name: "Headphones", category: "Electronics", price: 3000 },
    { id: 3, name: "T-Shirt", category: "Clothing", price: 1200 }
];

let cart = [];

/* ---------- RENDER PRODUCTS ---------- */
function renderProducts() {
    const list = document.getElementById("productList");
    list.innerHTML = "";

    storeProducts.forEach(product => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
            <h3>${product.name}</h3>
            <p>${product.category}</p>
            <p>₹${product.price}</p>
            <button onclick="addToCart(${product.id})">Add to Cart</button>
        `;
        list.appendChild(div);
    });
}

/* ---------- ADD TO CART ---------- */
function addToCart(id) {
    const product = storeProducts.find(p => p.id === id);
    const item = cart.find(i => i.id === id);

    if (item) item.quantity++;
    else cart.push({ ...product, quantity: 1 });

    renderCart();
}

/* ---------- RENDER CART ---------- */
function renderCart() {
    const body = document.getElementById("cartBody");
    body.innerHTML = "";

    let subtotal = 0;
    let discount = 0;
    const hour = new Date().getHours();

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        discount += getBulkDiscount(item, itemTotal);
        discount += getCategoryDiscount(item, itemTotal);

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${item.name}</td>
            <td>${item.category}</td>
            <td>₹${item.price}</td>
            <td>
                <input type="number" min="1" value="${item.quantity}"
                    onchange="updateQuantity(${index}, this.value)">
            </td>
            <td>₹${itemTotal}</td>
            <td>
                <button class="remove" onclick="removeItem(${index})">X</button>
            </td>
        `;
        body.appendChild(row);
    });

    if (hour >= 18 && hour <= 21) {
        discount += subtotal * 0.05;
    }

    document.getElementById("discount").textContent = discount.toFixed(2);
    document.getElementById("total").textContent = (subtotal - discount).toFixed(2);
}

/* ---------- CART ACTIONS ---------- */
function updateQuantity(index, value) {
    cart[index].quantity = Number(value);
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

/* ---------- DISCOUNT RULES ---------- */
function getBulkDiscount(item, total) {
    return item.quantity >= 5 ? total * 0.10 : 0;
}

function getCategoryDiscount(item, total) {
    if (item.category === "Electronics") return total * 0.15;
    if (item.category === "Clothing") return total * 0.10;
    return 0;
}

/* ---------- INIT ---------- */
renderProducts();
renderCart();
</script>

</body>
</html>
