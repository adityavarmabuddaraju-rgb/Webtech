<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        form { width: 350px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #0d6bcebc; color: rgb(39, 25, 25); border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #082f59; }
    </style>
</head>
<body>

    <form action="/submit-form-endpoint" method="post">
        <h2>Contact Us</h2>
        
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="user_name" placeholder="Your Full Name" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="user_email" placeholder="email@example.com" required>
        </div>

        <div>
            <label for="message">Message</label>
            <textarea id="message" name="user_message" rows="5" placeholder="How can we help you?"></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

</body>
</html>
